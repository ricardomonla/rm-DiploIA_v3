<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clases DiploIA v7.4</title>
    <link rel="stylesheet" href="css/styles.css?v=7.4.5">
    <!-- Google Fonts: Rajdhani for headers, Inter for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Rajdhani:wght@500;600;700&display=swap"
        rel="stylesheet">
    <!-- Prism.js for syntax highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <!-- Apex Background Atmosphere -->
    <div class="glow-blob blob-1"></div>
    <div class="glow-blob blob-2"></div>
    <div class="glow-blob blob-3"></div>

    <div class="container">
        <div class="sidebar" id="documents-sidebar">
            <div class="sidebar-header">
                <div class="header-row">
                    <h3>Navegación</h3>
                    <div class="header-actions">
                        <button id="sidebar-toggle-btn" class="icon-btn" title="Toggle Sidebar">📖</button>
                    </div>
                </div>
            </div>

            <div id="breadcrumb-nav" class="toc-container">
                <!-- Hierarchical navigation will be rendered here -->
            </div>

            <div id="context-view" class="context-view">
                <!-- Dynamic children list will be rendered here -->
            </div>


            <div class="sidebar-footer">
                <div class="admin-controls">
                    <button id="admin-mode-toggle" class="icon-btn" title="Modo Administración">
                        <i data-lucide="shield"></i>
                    </button>
                    <button id="open-mgmt-btn" class="icon-btn admin-only" title="Gestión Avanzada">
                        <i data-lucide="settings"></i>
                    </button>
                </div>
                <div class="version-tag">v7.4</div>
            </div>
        </div>
        <main>
            <div class="class-title-container">
                <h2 id="selected-class-title">Seleccionar una clase</h2>
            </div>
            <div class="video-container">
                <div id="youtube-player"></div>
            </div>

            <!-- Management Modal -->
            <div id="admin-modal" class="modal-backdrop" style="display: none;">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2>Gestión de Cursados</h2>
                        <button id="close-modal" class="icon-btn">✕</button>
                    </div>
                    <div class="modal-body">
                        <div id="cursados-editor-list"></div>
                        <button id="add-cursado-btn" class="action-btn">＋ Nuevo Cursado</button>
                    </div>
                    <div class="modal-footer">
                        <button id="save-all-btn" class="primary-btn">Guardar Cambios</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Prism.js for syntax highlighting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-yaml.min.js"></script>
    <script type="module" src="js/script.js?v=7.4.3"></script>
</body>

</html>
